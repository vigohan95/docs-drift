[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsdrift"
version = "0.2.0"
description = "Find places where a project's documentation contradicts itself, using the Clocked API"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[project.scripts]
docsdrift = "docsdrift.cli:main"

[tool.setuptools]
packages = ["docsdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
